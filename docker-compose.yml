# A local Postgres for the session warehouse (`make warehouse`). Bound to 127.0.0.1 only; trust auth, no password
# to keep. From a Metabase running in Docker, connect to host.docker.internal:55432, database claude_sessions,
# user convo, any password.
services:
  warehouse:
    image: postgres:16
    container_name: convo-analysis-pg
    environment:
      POSTGRES_DB: claude_sessions
      POSTGRES_USER: convo
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - convo-analysis-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convo -d claude_sessions"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A throwaway ClickHouse to try the ClickHouse load and every card's ClickHouse SQL offline
  # (make clickhouse-dev-test). Not started by `make warehouse`: it has its own profile. Local only, no volume.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    container_name: convo-analysis-ch
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: sessions
      CLICKHOUSE_USER: convo
      CLICKHOUSE_PASSWORD: convo
    ports:
      - "127.0.0.1:18123:8123"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  convo-analysis-pg:
