[project]
name = "convo-analysis"
version = "0.4.0"
description = "Export and analyze Claude Code sessions: skills, tools, tokens, cost, subagents, files, timing."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
session-analytics = "session_analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_analytics"]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["skills/session-export/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "E731", "UP007", "UP006", "UP035", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
